<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: "Cairo";
      src: url("../assets/Cairo-Regular.ttf");
    }

    body {
      font-family: "Cairo";
      margin: 40px;
      direction: rtl;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header img {
      width: 90px;
    }

    hr {
      margin: 20px 0;
    }

    h1 {
      text-align: center;
      margin: 40px 0;
    }

    .content {
      font-size: 15px;
      line-height: 2;
    }

    .footer {
      margin-top: 60px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="{{logo}}" style="width:90px" />
    <div>
      اسم الجهة<br />
      إدارة شؤون العاملين
    </div>
  </div>

  <hr />

  <h1>إفـــــادة</h1>

  <div class="content">
    <p>تشهد الجهة المذكورة أعلاه بأن:</p>

    <p>
      الاسم: <strong>{{name}}</strong><br />
      الرقم القومي: <strong>{{nationalId}}</strong>
    </p>

    <p>
      وقد تم إصدار هذه الإفادة بناءً على طلبه/طلبها لتقديمها إلى جهة رسمية.
    </p>

    <p>تحريرًا في: {{date}}</p>
  </div>

  <div class="footer">
    <p>مدير الإدارة</p>
    <p>............................</p>
  </div>

</body>
</html>
